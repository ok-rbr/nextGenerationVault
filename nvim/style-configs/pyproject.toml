# pyproject.toml - Python formatter reference template
# Preserved as an example for projects that want to copy local isort settings.

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
force_sort_within_sections = true

# Import grouping
known_first_party = []
known_third_party = []
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"

# Style preferences
combine_as_imports = true
force_single_line = false
atomic = true
