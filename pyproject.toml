[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voidlink-cli"
version = "0.1.0"
description = "VoidLink — vault-agent CLI for AI-assisted knowledge base management"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.7",
    "typer>=0.12",
    "structlog>=25.5",
    "rich>=13.0",
    "ollama>=0.6.2",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.scripts]
vault-agent = "voidlink_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voidlink_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
